services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: fetch-concursos:latest
    restart: unless-stopped
    environment:
      TELEGRAM_APITOKEN: ${TELEGRAM_APITOKEN:?Defina TELEGRAM_APITOKEN no arquivo de ambiente}
      TELEGRAM_ALLOWED_USER_ID: ${TELEGRAM_ALLOWED_USER_ID:?Defina TELEGRAM_ALLOWED_USER_ID no arquivo de ambiente}
      REDIS_URL: redis://redis:6379/0
      ENVIRONMENT: ${ENVIRONMENT:-prod}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
